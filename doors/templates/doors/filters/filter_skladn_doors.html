<div class="filter-doors">

<form class="row g-3" action="." method="get">
    <div class="col-md-3">
        <select class="form-select" id="validationCustom04" name="view_sk">
                {% for x in form_filter.view_sk %}
                {{x}}
                {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select class="form-select" id="validationCustom04" name="color_sk">
                {% for x in form_filter.color_sk %}
                {{x}}
                {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select class="form-select" id="validationCustom04" name="style_sk">
                {% for x in form_filter.style_sk %}
                {{x}}
                {% endfor %}
        </select>
    </div>

    <div class="col-md-3">
        <select class="form-select" id="validationCustom04" name="price_scale_sk" >
                {% for x in form_filter.price_scale_sk %}
                {{x}}
                {% endfor %}
        </select>
        <div class="invalid-feedback">
            Please select a valid state.
        </div>
    </div>
        <div class="col-md-3">

        <button class="btn btn-primary" type="submit">Фильтровать</button>
    </div>
</form>
</div>
