{% extends 'doors/base_new.html' %}
{% block content %}

<form class="row g-3" action="." method="get">

<div class="col-md-3">
<select class="form-select" id="validationCustom04" name="type">
      <option value="None">Тип</option>
        {% for x in form_filter.type %}
        {{x}}
        {% endfor %}
    </select>
</div>
<div class="col-md-3">
<select class="form-select" id="validationCustom04" name="lock">
      <option value="None">Замки</option>
        {% for x in form_filter.lock %}
    {{x}}
   {% endfor %}
    </select>  </div>

  <div class="col-md-3">
<select class="form-select" id="validationCustom04" name="color_inside">
      <option value="None">Цвет изнутри</option>
        {% for x in form_filter.color_inside %}
        {{x}}
   {% endfor %}
    </select>  </div>

    <div class="col-md-3">
<select class="form-select" id="validationCustom04"  name="style">
      <option value="None">Стиль</option>
        {% for x in form_filter.style %}
      {{x}}
   {% endfor %}
    </select>  </div>
<div class="col-md-3">
    <select class="form-select" id="validationCustom04" name="features">
      <option value="None">Особенности</option>
        {% for x in form_filter.features %}
      {{x}}
   {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
            <select class="form-select" id="validationCustom04" name="color_outside">
      <option value="None">Цвет снаружи</option>
        {% for x in form_filter.color_outside %}
      {{x}}
   {% endfor %}
    </select>

  </div>
  <div class="col-md-3">

    <select class="form-select" id="validationCustom04" name="price_scale" >

      <option value="None">По умолчанию</option>
         {% for x in form_filter.price_scale %}
     {{x}}
   {% endfor %}
    </select>
    <div class="invalid-feedback">
      Please select a valid state.
    </div>
  </div>
  <div class="col-12">

  </div>
  <div class="col-12">
      <input  type="submit" value="отправить">
<!--    <button class="btn btn-primary" type="submit">Фильтровать</button>-->
  </div>
</form>
<div class="products">


    <div class="card-all">
        {% for object in obj %}
        <div class="cardc-top">
            <div class="cardc-name"> <a href="{% url 'doors:detail_card' object.id  %}">{{object.title}}</a></div>
        <div class="cardc-color"> </div>

        <div class="cardc-image">
            {% for value in object.pictures %}
            <img src="{{ value.small }}" class="image_index">
        {% endfor %}
            </div>
        <div class="cardc-price">{{object.price}}</div>

        <form action="{% url 'cart:cart_add' object.id object.get_name %}" method="post">
            {% csrf_token %}
            {{cart_form}}
            <input type="submit" value="добавить" name='fname'>
<!--            <input class="form-control" type="submit" value="добавить" id="fname" name="fname">-->
        </form>
             </div>
        {% endfor %}

</div>

</div>
{% endblock %}
